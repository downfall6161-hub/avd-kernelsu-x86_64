name: Build AVD GKI Kernels

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      avd_target:
        description: 'AVD target to build'
        required: true
        type: choice
        options:
          - 'all'
          - 'a13-api33-5.15'
          - 'a14-api34-6.1'
          - 'a15-api35-6.6'
          - 'a16-api36.0-6.6'
          - 'a16-api36.1-6.12'
        default: 'all'
      ksu_ref:
        description: 'KernelSU / KernelSU-Next tag, commit, or auto for per-target defaults'
        required: true
        type: string
        default: 'auto'
      ksu_variant:
        description: 'KernelSU variant'
        required: true
        type: choice
        options:
          - 'KernelSU'
          - 'KernelSU-Next'
        default: 'KernelSU'
      arch:
        description: 'Target architecture'
        required: true
        type: choice
        options:
          - 'x86_64'
          - 'arm64'
          - 'both'
        default: 'x86_64'
      enable_susfs:
        description: 'Apply SUSFS kernel patches (requires KernelSU-Next + dev-susfs)'
        required: false
        type: boolean
        default: false
      susfs_ref:
        description: 'susfs4ksu branch matching the kernel generation'
        required: false
        type: string
        default: 'gki-android16-6.12'
      susfs_ksu_ref:
        description: 'KernelSU-Next ref/branch that already has SUSFS glue'
        required: false
        type: string
        default: 'dev-susfs'

jobs:
  build:
    name: Build Artifacts
    uses: ./.github/workflows/_build-gki-core.yml
    with:
      avd_target: ${{ inputs.avd_target }}
      ksu_ref: ${{ inputs.ksu_ref }}
      ksu_variant: ${{ inputs.ksu_variant }}
      arch: ${{ inputs.arch }}
      release_build: false
      enable_susfs: ${{ inputs.enable_susfs }}
      susfs_ref: ${{ inputs.susfs_ref }}
      susfs_ksu_ref: ${{ inputs.susfs_ksu_ref }}
